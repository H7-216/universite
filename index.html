<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Actualités – Université Côte d’Azur</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: white;
        overflow-x: hidden;
    }

    /* HEADER */
    header {
        width: 100%;
        padding: 20px;
        background: rgba(0,0,0,0.7);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
    }

    header h1 {
        margin: 0;
        font-size: 1.8rem;
        color: #ff66c4;
        text-shadow: 0 0 10px #ff66c4;
    }

    nav a {
        margin-left: 20px;
        color: white;
        text-decoration: none;
        font-size: 1.1rem;
        transition: 0.2s;
    }

    nav a:hover {
        color: #ff66c4;
    }

    /* SECTION ACTUALITÉS */
    #news {
        margin-top: 120px;
        padding: 20px;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
    }

    .article {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        transition: 0.2s;
    }

    .article:hover {
        background: rgba(255,255,255,0.1);
    }

    .article h2 {
        margin: 0;
        color: #ff66c4;
    }

    /* OVERLAY VICE CITY */
    #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 20;
    }

    #overlay iframe {
        width: 90vw;
        height: 90vh;
        border: none;
    }

    #closeOverlay {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #ff66c4;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
    }

    /* FOOTER */
    footer {
        margin-top: 50px;
        padding: 20px;
        background: rgba(0,0,0,0.7);
        text-align: center;
        backdrop-filter: blur(10px);
    }

    footer a {
        color: #ff66c4;
        margin: 0 10px;
        text-decoration: none;
    }

    /* MODAL */
    #modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 30;
    }

    #modalContent {
        background: #111;
        padding: 30px;
        border-radius: 10px;
        max-width: 600px;
        text-align: center;
    }

    #closeModal {
        margin-top: 20px;
        background: #ff66c4;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
    }
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>Actualités UCA & France</h1>
    <nav>
        <a href="#" onclick="loadNews('france')">France</a>
        <a href="#" onclick="loadNews('uca')">Université Côte d’Azur</a>
        <a href="#" onclick="openViceCity()">Vice City Online</a>
    </nav>
</header>

<!-- SECTION ACTUALITÉS -->
<section id="news">
    <h2>Chargement des actualités...</h2>
</section>

<!-- OVERLAY VICE CITY -->
<div id="overlay">
    <div id="closeOverlay" onclick="closeViceCity()">Fermer</div>
    <iframe src="https://web.archive.org/web/20260901085540/https://quenq.com/apps/vice-city-online/" allowfullscreen></iframe>
</div>

<!-- FOOTER -->
<footer>
    <a href="#" onclick="openModal('Politique du site')">Politique</a>
    <a href="#" onclick="openModal('Mentions légales')">Mentions légales</a>
    <a href="#" onclick="openModal('Confidentialité')">Confidentialité</a>
</footer>

<!-- MODAL -->
<div id="modal">
    <div id="modalContent">
        <h2 id="modalTitle"></h2>
        <p>Contenu de la section sélectionnée.</p>
        <div id="closeModal" onclick="closeModal()">Fermer</div>
    </div>
</div>

<script>
/* API ACTUALITÉS */
function loadNews(type) {
    const newsDiv = document.getElementById("news");
    newsDiv.innerHTML = "<h2>Chargement...</h2>";

    let url = "";

    if (type === "france") {
        url = "https://newsapi.org/v2/top-headlines?country=fr&apiKey=demo";
    } else {
        url = "https://newsapi.org/v2/everything?q=université%20côte%20d’azur&apiKey=demo";
    }

    fetch(url)
        .then(res => res.json())
        .then(data => {
            newsDiv.innerHTML = "";
            data.articles.forEach(a => {
                newsDiv.innerHTML += `
                    <div class="article">
                        <h2>${a.title}</h2>
                        <p>${a.description || ""}</p>
                        <a href="${a.url}" target="_blank">Lire l’article</a>
                    </div>
                `;
            });
        });
}

/* OVERLAY VICE CITY */
function openViceCity() {
    document.getElementById("overlay").style.display = "flex";
}

function closeViceCity() {
    document.getElementById("overlay").style.display = "none";
}

/* MODAL */
function openModal(title) {
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

/* CHARGEMENT INITIAL */
loadNews("france");
</script>

</body>
</html>
